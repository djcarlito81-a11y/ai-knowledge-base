<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 知识库与工作台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: { 50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 750: '#293548', 800: '#1e293b', 850: '#172033', 900: '#0f172a', 950: '#020617' }
          },
          animation: {
            'fade-in': 'fadeIn 0.2s ease-out',
            'slide-up': 'slideUp 0.3s ease-out',
            'slide-in-right': 'slideInRight 0.3s ease-out',
            'pulse-dot': 'pulseDot 1.4s infinite ease-in-out',
            'bounce-gentle': 'bounceGentle 0.6s ease-out'
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(12px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
            slideInRight: { '0%': { opacity: '0', transform: 'translateX(20px)' }, '100%': { opacity: '1', transform: 'translateX(0)' } },
            pulseDot: { '0%, 80%, 100%': { opacity: '0.3', transform: 'scale(0.8)' }, '40%': { opacity: '1', transform: 'scale(1)' } },
            bounceGentle: { '0%': { transform: 'scale(0.95)' }, '50%': { transform: 'scale(1.02)' }, '100%': { transform: 'scale(1)' } }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-surface-950 text-gray-100 min-h-screen transition-colors duration-300">

  <!-- ===== Toast Container ===== -->
  <div id="toast-container" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- ===== Confirm Dialog ===== -->
  <div id="confirm-dialog" class="fixed inset-0 z-[90] flex items-center justify-center bg-black/60 backdrop-blur-sm hidden animate-fade-in">
    <div class="bg-surface-800 rounded-2xl p-6 w-full max-w-md mx-4 shadow-2xl border border-surface-700 animate-slide-up">
      <h3 class="text-lg font-semibold mb-2" id="confirm-title">确认操作</h3>
      <p class="text-gray-400 mb-6" id="confirm-message">确定要执行此操作吗？</p>
      <div class="flex gap-3 justify-end">
        <button id="confirm-cancel" class="px-4 py-2 rounded-xl bg-surface-700 hover:bg-surface-600 text-gray-300 transition-colors">取消</button>
        <button id="confirm-ok" class="px-4 py-2 rounded-xl bg-red-600 hover:bg-red-500 text-white transition-colors">确认</button>
      </div>
    </div>
  </div>

  <!-- ===== PIN Lock Screen ===== -->
  <div id="lock-screen" class="fixed inset-0 z-[200] bg-surface-950 flex flex-col items-center justify-center hidden">
    <div class="w-full max-w-sm mx-auto px-6 text-center animate-fade-in">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white text-2xl font-bold shadow-xl shadow-indigo-500/20 mx-auto mb-6">AI</div>
      <h2 class="text-xl font-bold mb-1">知识库工作台</h2>
      <p class="text-sm text-gray-500 mb-6">输入 PIN 码解锁</p>
      <div class="flex gap-2 justify-center mb-4" id="pin-dots">
        <div class="w-3 h-3 rounded-full bg-surface-700 transition-colors dot-0"></div>
        <div class="w-3 h-3 rounded-full bg-surface-700 transition-colors dot-1"></div>
        <div class="w-3 h-3 rounded-full bg-surface-700 transition-colors dot-2"></div>
        <div class="w-3 h-3 rounded-full bg-surface-700 transition-colors dot-3"></div>
        <div class="w-3 h-3 rounded-full bg-surface-700 transition-colors dot-4"></div>
        <div class="w-3 h-3 rounded-full bg-surface-700 transition-colors dot-5"></div>
      </div>
      <p id="pin-error" class="text-xs text-red-400 mb-4 hidden">PIN 码错误，请重试</p>
      <div class="grid grid-cols-3 gap-3 max-w-[280px] mx-auto" id="pin-keypad">
        <!-- Generated by JS -->
      </div>
      <button id="pin-reset-btn" class="mt-5 text-xs text-gray-600 hover:text-gray-400 transition-colors">清除 PIN 码（需在浏览器控制台执行）</button>
    </div>
  </div>

  <!-- ===== Main App Shell ===== -->
  <div class="flex flex-col h-screen overflow-hidden" id="app-shell">

    <!-- Header -->
    <header class="flex-shrink-0 h-16 bg-surface-900/80 backdrop-blur-md border-b border-surface-800 px-4 md:px-6 flex items-center gap-3 z-30">
      <!-- Logo -->
      <div class="flex items-center gap-2.5 mr-2 flex-shrink-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-indigo-500/20">AI</div>
        <span class="font-semibold text-base hidden sm:block whitespace-nowrap">知识库工作台</span>
      </div>

      <!-- Global Search -->
      <div class="flex-1 max-w-2xl relative">
        <svg class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input
          id="global-search"
          type="text"
          placeholder="搜索待办和笔记... (Ctrl+K)"
          class="w-full pl-10 pr-10 py-2.5 bg-surface-800 border border-surface-700 rounded-xl text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500/50 transition-all"
        >
        <button id="search-clear" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-surface-600 hover:bg-surface-500 text-gray-400 hover:text-gray-200 flex items-center justify-center text-xs transition-colors hidden">✕</button>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center gap-1.5 flex-shrink-0">
        <button id="theme-toggle" class="w-9 h-9 rounded-xl hover:bg-surface-800 flex items-center justify-center text-gray-400 hover:text-gray-200 transition-colors" title="切换主题">
          <svg class="w-5 h-5" id="theme-icon-sun" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path stroke-linecap="round" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="w-5 h-5 hidden" id="theme-icon-moon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
      </div>
    </header>

    <!-- Body: Sidebar + Main -->
    <div class="flex flex-1 overflow-hidden">

      <!-- Desktop Sidebar -->
      <aside class="hidden md:flex flex-col w-56 lg:w-64 bg-surface-900/50 border-r border-surface-800 flex-shrink-0">
        <nav class="flex-1 py-4 px-3 space-y-1" id="desktop-nav"></nav>
        <div class="p-3 border-t border-surface-800">
          <div class="flex items-center gap-3 px-3 py-2 rounded-xl bg-surface-800/50">
            <div class="w-8 h-8 rounded-full bg-gradient-to-br from-emerald-400 to-cyan-500 flex items-center justify-center text-white text-xs font-bold">Y</div>
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium truncate">我的工作台</p>
              <p class="text-xs text-gray-500">数据存储于本地</p>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 overflow-hidden flex flex-col" id="main-content">
        <!-- View: Todo -->
        <section id="view-todo" class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 hidden"></section>
        <!-- View: Inbox -->
        <section id="view-inbox" class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 hidden"></section>
        <!-- View: Chat -->
        <section id="view-chat" class="flex-1 overflow-hidden flex flex-col hidden"></section>
        <!-- View: Settings -->
        <section id="view-settings" class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8 hidden"></section>
      </main>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="md:hidden flex-shrink-0 h-16 bg-surface-900/95 backdrop-blur-md border-t border-surface-800 flex items-center justify-around px-2 z-30" id="mobile-nav"></nav>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
